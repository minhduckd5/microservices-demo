# --- START MODIFICATION ---
# Component: instrument Online Boutique services to ship telemetry to the new
# in-cluster observability stack (observability namespace).
#
# What this component does, per service:
#   - Sets COLLECTOR_SERVICE_ADDR, OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME
#     so existing app code (which already supports OTel) routes to the new gateway.
#   - Adds OTEL_RESOURCE_ATTRIBUTES for correlation (deployment.environment, service.namespace).
#   - Enables tracing (ENABLE_TRACING=1), keeps profiler off.
#   - Adds prometheus.io/scrape annotations on the frontend so its native /metrics
#     endpoint is also scraped directly (in addition to OTel-exported metrics).
#
# Use INSTEAD of `components/observability-onprem` when adopting the full stack.
# Reference example:
#   kustomize/environments/onprem/base/kustomization.yaml
#     components:
#       - ../../../components/observability-app-stack
# --- END MODIFICATION ---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # frontend
  - target: { kind: Deployment, name: frontend }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
              prometheus.io/path: "/metrics"
          spec:
            containers:
              - name: server
                env:
                  - name: COLLECTOR_SERVICE_ADDR
                    value: "otel-collector.observability.svc.cluster.local:4317"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://otel-collector.observability.svc.cluster.local:4317"
                  - name: OTEL_EXPORTER_OTLP_PROTOCOL
                    value: "grpc"
                  - name: OTEL_SERVICE_NAME
                    value: "frontend"
                  - name: OTEL_RESOURCE_ATTRIBUTES
                    value: "service.namespace=default,deployment.environment=dev"
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: ENABLE_PROFILER
                    value: "0"

