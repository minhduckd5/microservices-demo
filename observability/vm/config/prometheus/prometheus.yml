global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: onprem-vm
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: otel-collector
    static_configs:
      - targets:
          - "otel-collector:8888"
          - "otel-collector:8889"

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Override with the actual frontend URL on the K8s side, e.g.
          # http://k3s-control:30080 or http://<traefik-host>/ via /etc/hosts.
          - http://k3s-control/_healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Static targets for K3s nodes' kubelet cAdvisor (if exposed) and node_exporter
  # running on each VM via systemd. Adjust to match your VM topology.
  - job_name: vm-node-exporters
    static_configs:
      - targets:
          - "192.168.31.210:9100"   # k3s-control
          - "192.168.31.211:9100"   # k3s-worker1
          - "192.168.31.212:9100"   # k3s-worker2
        labels:
          fleet: k3s-vms
