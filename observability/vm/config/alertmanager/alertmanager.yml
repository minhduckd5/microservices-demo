global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "critical"]
      receiver: oncall
      continue: true

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname"]

receivers:
  - name: default
    webhook_configs:
      - url: http://localhost:5001/
        send_resolved: true
  - name: oncall
    webhook_configs:
      - url: http://localhost:5001/oncall
        send_resolved: true
