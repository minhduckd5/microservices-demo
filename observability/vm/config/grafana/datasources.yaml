apiVersion: 1
datasources:
  - uid: prom
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      manageAlerts: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo

  - uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags: [{ key: "service.name", value: "service" }]
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prom
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
      serviceMap:
        datasourceUid: prom
      nodeGraph: { enabled: true }
      lokiSearch: { datasourceUid: loki }
