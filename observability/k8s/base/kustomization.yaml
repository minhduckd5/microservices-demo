# --- START MODIFICATION ---
# Observability platform stack — base.
# Apply with:
#   kubectl apply -k observability/k8s/base
# Overlays adjust retention, replicas, and ingress hostnames.
# --- END MODIFICATION ---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

commonLabels:
  app.kubernetes.io/part-of: observability-stack
  managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 10-prometheus.yaml
  - 11-alertmanager.yaml
  - 20-loki.yaml
  - 21-promtail.yaml
  - 30-tempo.yaml
  - 40-otel-collector.yaml
  - 50-node-exporter.yaml
  - 51-kube-state-metrics.yaml
  - 52-blackbox-exporter.yaml
  - 60-grafana.yaml
  - 61-grafana-dashboards.yaml
